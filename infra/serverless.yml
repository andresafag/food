org: andresafag
app: my-app
service: express-pug-app

frameworkVersion: '4'
custom:
  serverless-offline:
    noPrependStageInUrl: true

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1 
  stage: dev
  environment:
    API_KEY: ${env:API_KEY}
    AWS_LAMBDA_EXEC_WRAPPER: /opt/otel-instrument
# Endpoint base donde Prometheus escucha OTLP
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://44.210.111.254:9090"
    OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"

    # Habilitar métricas
    OTEL_METRICS_EXPORTER: "otlp"
    
    # Deshabilitar logs y trazas explícitamente para evitar buscar exportadores faltantes
    OTEL_LOGS_EXPORTER: "none"
    OTEL_TRACES_EXPORTER: "none"

    # Configuración de tiempos
    OTEL_METRIC_EXPORT_INTERVAL: "5000"
    OTEL_METRIC_EXPORT_TIMEOUT: "3000"
    OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: "DELTA"

  apiGateway:
    binaryMediaTypes:
      - '*/*'

functions:
  api:
    handler: handler.handler
    events:
      - http:
          path: /
          method: any
      - http:
          path: '{proxy+}'
          method: any
    layers:
      - arn:aws:lambda:us-east-1:615299751070:layer:AWSOpenTelemetryDistroJs:1

package:
  individually: true
  patterns:
    - '!**'                
    - '../app.js'
    - '../handler.js'
    - '../package.json'
    - '../node_modules/**'
    - '../views/**'        
    - '../public/**'       

