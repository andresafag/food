org: andresafag
app: my-app
service: express-pug-app

frameworkVersion: '4'
custom:
  serverless-offline:
    noPrependStageInUrl: true

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1 
  stage: dev
  environment:
    API_KEY: ${env:API_KEY}
    AWS_LAMBDA_EXEC_WRAPPER: /opt/otel-instrument
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://44.210.111.254:9090"
    OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
    
    # Ambos en otlp para activar el SDK
    OTEL_METRICS_EXPORTER: "otlp"
    OTEL_TRACES_EXPORTER: "otlp"
    
    # Ajuste de tiempos para evitar el error de clamping
    OTEL_METRIC_EXPORT_INTERVAL: "5000"
    OTEL_METRIC_EXPORT_TIMEOUT: "3000"
    OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: "DELTA"

    # Reducción de tiempo de flush para entornos Serverless
    OTEL_METRIC_EXPORT_INTERVAL: "1000"
    OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: "DELTA"

  apiGateway:
    binaryMediaTypes:
      - '*/*'

functions:
  api:
    handler: handler.handler
    events:
      - http:
          path: /
          method: any
      - http:
          path: '{proxy+}'
          method: any
    layers:
      - arn:aws:lambda:us-east-1:615299751070:layer:AWSOpenTelemetryDistroJs:15

package:
  individually: true
  patterns:
    - '!**'                
    - '../app.js'
    - '../handler.js'
    - '../package.json'
    - '../node_modules/**'
    - '../views/**'        
    - '../public/**'       

