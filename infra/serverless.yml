org: andresafag
app: my-app
service: express-pug-app
useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1 
  stage: dev
  httpApi:
    cors:
      allowedOrigins:
        - '*'
      allowedHeaders:
        - Content-Type
        - X-Amz-Date
        - Authorization
        - X-Api-Key
        - X-Amz-Security-Token
        - X-Amz-User-Agent
      allowedMethods:
        - GET
        - POST
  environment:
    API_KEY: ${env:API_KEY}
    OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "http://${env:OTEL_EXPORTER_IP}:9090/api/v1/otlp"
    OTEL_EXPORTER_OTLP_METRICS_PROTOCOL: "http/protobuf"
    OTEL_METRICS_EXPORTER: "otlp"
    OTEL_METRIC_EXPORT_INTERVAL: "5000"
    OTEL_METRIC_EXPORT_TIMEOUT: "3000"
    OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: "CUMULATIVE"
    OTEL_SERVICE_NAME: "foodmania-api"
    OTEL_EXPORTER_PROMETHEUS_WITHOUT_UNITS: true

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false

    external:
      - pug

functions:
  api:
    handler: handler.handler
    events:
      - httpApi:
          path: /
          method: any
      - httpApi:
          path: /{proxy+}
          method: any
      - schedule:
          rate: rate(2 minutes)
          enabled: true
          input:
            source: 'aws.events'
            detail-type: 'Scheduled Event'
            action: 'warmup'

package:
  individually: true
  patterns:
    - '../views/**'
    - '../public/**'
